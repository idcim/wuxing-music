# H5 站点：托管 Taro 静态产物 + 同源反代后端（免 CORS、不写死后端域名）
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;      # 头像上传（后端限 5MB），留余量。曲目音频不从 H5 端传
    proxy_http_version 1.1;        # Range/keep-alive 走 HTTP/1.1（默认 1.0）

    root /usr/share/nginx/html;
    index index.html;

    # SPA / hash 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代到后端容器（compose 服务名 api）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 本地存储的上传文件（曲目音频 / 头像 / 封面等，后端 /uploads 静态挂载）
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 音频靠 HTTP Range 边下边播（后端 StaticFiles 已支持 206）。
        # 必须关掉响应缓冲：默认 proxy_buffering on + proxy_max_temp_file_size 1024m，
        # 会把上百 MB 的 WAV 先落到 nginx 临时文件再吐给客户端，首播变慢还占盘。
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
