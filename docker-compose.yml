# 五行律音 · 一键启动后端 API + 管理后台
# 用法：docker compose up -d --build
# 数据库连接、JWT、管理员账号等配置读取 backend/.env
#
# 部署到 1Panel：MySQL 在 1Panel 的 1panel-network 网络内，
# 本 compose 让 api/admin 接入同一外部网络，用 MySQL 容器名直连。
# .env 的 DATABASE_URL 形如：
#   mysql+pymysql://用户名:密码@<MySQL容器名>:3306/wuxing?charset=utf8mb4

services:
  api:
    build: ./backend
    image: wuxing-backend:latest
    container_name: wuxing-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 由 scripts/auto-deploy.sh 在 up 之前 export；本地手动起就是空。
      # 供 GET /api/health 回显，用来从外部确认线上跑的到底是哪个提交。
      - GIT_COMMIT=${GIT_COMMIT:-}
      - BUILT_AT=${BUILT_AT:-}
    ports:
      - "8000:8000"
    # 宿主机 DNS 不稳会同时表现为「jscode2session 解析失败」和「MySQL 查询中途断连」
    # （Docker 内嵌 DNS 的外部转发走宿主 resolv.conf）；固定公共 DNS 兜底。
    # 容器名解析（MySQL 走 1panel-network）由内嵌 DNS 负责，不受此影响。
    dns:
      - 223.5.5.5
      - 119.29.29.29
    volumes:
      - uploads_data:/app/uploads
      - commerce_private_data:/app/private-commerce
    networks:
      - default          # 与 admin 互通
      - onepanel          # 接入 1Panel 网络以访问 MySQL

  commerce-worker:
    profiles: [commerce]
    build: ./backend
    image: wuxing-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: [python, -m, app.commerce.worker, --queue, transactions]
    healthcheck:
      test: [CMD, python, -m, app.commerce.monitor, --check]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    dns:
      - 223.5.5.5
      - 119.29.29.29
    volumes:
      - commerce_private_data:/app/private-commerce
    networks:
      - default
      - onepanel

  commerce-media-worker:
    profiles: [commerce]
    image: wuxing-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: [python, -m, app.commerce.worker, --queue, media]
    healthcheck:
      test: [CMD, python, -m, app.commerce.monitor, --check]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    dns:
      - 223.5.5.5
      - 119.29.29.29
    volumes:
      - commerce_private_data:/app/private-commerce
    networks:
      - default
      - onepanel

  admin:
    build: ./admin
    image: wuxing-admin:latest
    container_name: wuxing-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - default

  h5:
    build:
      context: .
      dockerfile: docker/Dockerfile.h5
    image: wuxing-h5:latest
    container_name: wuxing-h5
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api
    networks:
      - default

volumes:
  uploads_data:
  commerce_private_data:

networks:
  default:
  # 1Panel 已创建的网络（external），MySQL 容器在其中
  onepanel:
    external: true
    name: 1panel-network
