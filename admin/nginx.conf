server {
    listen 80;
    server_name _;

    # 允许较大文件上传（音频等），需 >= 后端上传上限。
    # 注意：>100MB 的 WAV 走 OSS 直传，不经这里；本值只管服务器中转的那条路径。
    client_max_body_size 512m;

    # 大文件上传不要先在 nginx 缓冲整包再转发，否则内存/临时盘翻倍且首字节延迟高
    proxy_request_buffering off;
    proxy_http_version 1.1;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：找不到文件时回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代 /api 到后端容器（compose 服务名 api）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传耗时长，别让代理提前掐断
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 上传文件（曲目音频 / 封面）。
    # 此前**没有这条 location**，/uploads/... 会落到上面的 try_files 回退成 index.html，
    # 于是后台的音频试听 <audio :src="audio_url"> 和时长自动识别拿到的是一份 HTML（200），
    # 表现为「传完了但播不了、时长识别不出来」。
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 音频靠 HTTP Range 边下边播：关掉响应缓冲，让 206 分段直接透传，
        # 否则 nginx 会把上百 MB 先缓冲到临时文件，拖慢首播并占盘。
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
